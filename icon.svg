<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#121926"/>
  <!-- 奖杯 -->
  <g transform="translate(256,160)" fill="none" stroke="#ffd43b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-80,100 v-80 a80,80 0 0,1 160,0 v80"/>
    <path d="M-80,60 h-40 a30,30 0 0,1 0,-60 c20,0 40,0 40,60"/>
    <path d="M80,60 h40 a30,30 0 0,0 0,-60 c-20,0 -40,0 -40,60"/>
    <line x1="-40" y1="100" x2="40" y2="100" stroke-width="12"/>
    <!-- 杯耳 -->
    <path d="M-80,60 c-20,-10 -20,-30 0,-40" stroke-width="10"/>
    <path d="M80,60 c20,-10 20,-30 0,-40" stroke-width="10"/>
  </g>
  <!-- 2026 -->
  <text x="256" y="380" text-anchor="middle" font-size="56" font-weight="bold" fill="#ffd43b" font-family="Arial,sans-serif">2026</text>
  <!-- 足球花纹 -->
  <g transform="translate(256,160)" fill="#ffd43b" opacity="0.3">
    <polygon points="0,-35 10,-12 35,-12 15,5 22,30 0,15 -22,30 -15,5 -35,-12 -10,-12" transform="scale(0.6)"/>
  </g>
</svg>
